        .map-chooser button[aria-pressed="true"] {
            background: var(--forest);
            color: #fff;
            border-color: var(--forest)
        }

        .map-frame {
            display: block;
            width: 100%;
            height: 350px;
            border: 0;
            background: #e8efeb
        }

        .map-info {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            padding: 9px 12px
        }

        .map-info strong {
            font-size: .94rem
        }

        .map-info span {
            color: var(--muted);
            font-size: .77rem
        }

        @media(max-width:650px) {
            .map-frame {
                height: 300px
            }

            .map-chooser {
                gap: 4px;
                padding: 7px
            }

            .map-chooser button {
                font-size: .71rem;
                padding: 5px 8px
            }

            .map-info {
                padding: 8px
            }
        }

        @media print {

            .map-chooser,
            .map-frame {
                display: none
            }

            .map-shell {
                border: 1px solid #ccc
            }

            .map-info {
                padding: 5px
            }
        }

        .single-chooser[hidden] {
            display: none !important
        }

        .single-chooser {
            background: #fff;
            border-bottom: 1px solid var(--line)
        }

        .map-pins {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px;
            padding: 10px 12px;
            border-top: 1px solid var(--line)
        }

        .pin-item {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--ink);
            text-decoration: none;
            font-size: .79rem;
            border: 1px solid #e1e9e0;
            border-radius: 10px;
            padding: 7px 9px;
            background: #fbfcfa
        }

        .pin-item:hover {
            border-color: var(--forest2);
            background: #eef4ed
        }

        .pin-number {
            width: 24px;
            height: 24px;
            flex: 0 0 24px;
            border-radius: 50%;
            background: var(--forest);
            color: #fff;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: .72rem;
            font-weight: 800
        }

        .pin-item.day2 .pin-number {
            background: #a16a37
        }

        .pin-name {
            min-width: 0;
            line-height: 1.3
        }

        .pin-day {
            font-size: .7rem;
            color: var(--muted);
            display: block
        }

        @media(max-width:650px) {
            .map-pins {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 5px;
                padding: 8px
            }

            .pin-item {
                font-size: .72rem;
                padding: 6px
            }

            .pin-number {
                width: 22px;
                height: 22px;
                flex-basis: 22px
            }
        }

        @media print {
            .map-pins {
                grid-template-columns: repeat(3, 1fr)
            }

            .map-chooser {
                display: none
            }
        }
    </style>
</head>

<body>
    <header class="hero">
        <div class="inner">
            <div class="eyebrow">FAMILY JOURNEY · MIAOLI 2026</div>
            <h1>山裡<span>相聚</span><br>慢慢走，慢慢聊</h1>
            <p class="lead">泰安觀止溫泉會館午餐 × 泰安山谷溫泉 × 烏嘎彥竹林 × 荷塘居<br>一趟為家人而安排的兩天一夜山林旅行。</p>
                <div class="hero-pills"><span>2026.12.07 — 12.08</span><span>更新日期：2026.11.22 16:44</span></div>
        </div>
    </header>
    <nav class="sticky">
        <div class="nav"><a href="#overview">旅程概要</a><a href="#schedule">每日行程</a><a
                href="#route">導航地圖</a></div>
    </nav>
    <main class="container">
        <section id="schedule" class="section">
            <div class="day-head">
                <div>
                    <h2>行程</h2>
                </div>
                <div class="day-actions"><div class="day-toggle" role="tablist"><button id="tab0" role="tab" aria-selected="true"
                        onclick="switchDay(0)">12/7 星期一</button><button id="tab1" role="tab" aria-selected="false"
                        onclick="switchDay(1)">12/8 星期二</button></div><a class="action"
                        href="苗栗泰安兩天一夜每日時間軸.docx" download>下載行程</a></div>
            </div>
            <div id="days"></div>
        </section>
        <section id="route" class="section">
            <h2>地圖與行車導航</h2>
            <div class="map-shell" id="interactive-place-map">
                <div class="map-chooser" role="group" aria-label="地圖顯示範圍">
                    <button type="button" aria-pressed="true" data-map-mode="all">全部 3 站</button>
                    <button type="button" aria-pressed="false" data-map-mode="day1">12/7 第一日</button>
                    <button type="button" aria-pressed="false" data-map-mode="day2">12/8 第二日</button>
                    <button type="button" aria-pressed="false" data-map-mode="single">單點查看</button>
                </div>
                <div class="map-chooser single-chooser" id="single-map-chooser" role="group" aria-label="選擇個別景點" hidden>
                    <button type="button" aria-pressed="true" data-map-place="hotel">泰安觀止</button>
                    <button type="button" aria-pressed="false" data-map-place="bamboo">烏嘎彥竹林</button>
                    <button type="button" aria-pressed="false" data-map-place="persimmon">荷塘居</button>
                </div>
                <iframe class="map-frame" id="place-map-frame" title="全部三個景點 Google 地圖" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade" src="about:blank"></iframe>
                <div class="map-info" hidden>
                    <div><strong id="map-place-name">全部 3 站｜兩天路線</strong><span
                            id="map-place-address">依旅遊順序同時標示景點，切換每日可查看分日路線。</span></div><a class="action primary"
                        id="map-open-link" target="_blank" rel="noopener" href="#route">在 Google Maps 查看全路線 ↗</a>
                </div>
                <div class="map-pins" id="map-pins" aria-label="行程景點標記清單"></div>
            </div>
        </section>

    </main>
    <footer class="footer">山裡相聚 · Miaoli Family Journey 2026<br>願這兩天，有更多一起坐下來聊天的時光。</footer>
    <script>
        const PLACES = [];
        const DAYS = [];
        PLACES.splice(0, PLACES.length,
            { id: 'hotel', title: '泰安觀止溫泉會館', type: '山林住宿・溫泉休憩', address: '苗栗縣泰安鄉錦水村圓墩58號', phone: '037-941777', site: 'https://www.papawaqa.com.tw/', blurb: '抵達後可使用戶外泡湯設施，並安排下午茶、晚餐與住宿休息。', highlights: ['14:00 起開放戶外泡湯區', '請自備泳帽與泳衣', '下午茶與 18:00 晚餐'], warning: '泳裝區須著泳帽、泳衣；請依飯店當日規定使用設施。' },
            { id: 'bamboo', title: '烏嘎彥竹林', type: '綠色竹林・山路短訪', address: '苗栗縣泰安鄉大興村烏嘎彥竹林', phone: '037-941025', site: 'https://media.taiwan.net.tw/en-us/portal/travel/details/attraction_376450000a_000949', blurb: '翠綠竹林形成天然的光影隧道，適合安排短暫散步與拍照。', highlights: ['竹林綠蔭', '短距離欣賞', '上午自然光'], warning: '產業道路狹窄蜿蜒，請依天候與路況調整行程。' },
            { id: 'persimmon', title: '荷塘居', type: '田園料理・第二天午餐', address: '苗栗縣公館鄉館南村 13 鄰 332 號', phone: '037-233456', site: 'https://media.taiwan.net.tw/en-us/portal/travel/details/restaurant_a55000000a_003611', blurb: '第二天造訪烏嘎彥竹林後，前往公館荷塘居享用午餐。', highlights: ['第二天午餐', '套餐與桌菜', '田園景觀'], warning: '桌菜請先透過臉書預約，並確認團體座位與餐點。' },
            { id: 'hsr', title: '苗栗高鐵站', type: '返程會合・解散', address: '苗栗縣後龍鎮高鐵三路268號', phone: '', site: 'https://www.thsrc.com.tw/', blurb: '旅程的最後會合點，確認全員、行李與車輛後各自安全返程。', highlights: ['返程集合', '高鐵接送', '車輛清點'], warning: '請依當日導航與路況保留充裕交通時間。' }
        );
        DAYS.splice(0, DAYS.length,
            { date: '12/7', weekday: '星期一', subtitle: '', items: [
                ['12:30–14:00', '午餐 泰安觀止溫泉會館', '於泰安觀止溫泉會館享用午餐，餐後直接安排泡湯與休憩。', 'hotel', '用餐', '苗栗縣泰安鄉錦水村圓墩58號'],
                ['14:00–18:00', '泡湯、下午茶', '泡湯需自備泳帽、泳衣；飯店提供拖鞋、大毛巾與沐浴用品。<br>露天風呂：14:00–22:00<br>下午茶：14:00–16:30', 'hotel', '泡湯'],
                ['18:00–19:30', '晚餐', '', 'hotel', '用餐']
            ] },
            { date: '12/8', weekday: '星期二', subtitle: '', items: [
                ['07:30–10:00', '自行早餐及自由活動', '', 'hotel', '自由'],
                ['10:00–10:30', '前往烏嘎彥竹林', '位在苗栗縣泰安鄉大興村。小徑兩旁的竹子向上交疊，形成一段約 100 公尺的天然隧道。晴天時，陽光從竹葉縫隙灑進來，走在裡面就能看到深淺不同的綠色。', 'bamboo', '移動', '苗栗縣泰安鄉大興村烏嘎彥竹林'],
                ['10:30–11:30', '烏嘎彥竹林散步', '', 'bamboo', '戶外'],
                ['11:30–12:00', '前往荷塘居', '荷塘居結合田園景觀與美食，提供套餐與桌菜；桌菜請先透過臉書預約。', 'persimmon', '移動', '苗栗縣公館鄉館南村 13 鄰 332 號'],
                ['12:00–13:30', '午餐 荷塘居', '', 'persimmon', '用餐']
            ] }
        );
        const place = id => PLACES.find(p => p.id === id), nav = id => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place(id).title + ' ' + place(id).address);
        const route = (ids) => 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=' + encodeURIComponent(place(ids[0]).address) + '&destination=' + encodeURIComponent(place(ids.at(-1)).address) + '&waypoints=' + encodeURIComponent(ids.slice(1, -1).map(id => place(id).address).join('|'));
        const mapFrame = document.getElementById('place-map-frame');
        const MAP_ORDER = ['hotel', 'bamboo', 'persimmon'];
        const MAP_GROUPS = { all: MAP_ORDER, day1: ['hotel'], day2: ['hotel', 'bamboo', 'persimmon'] };
        const mapModes = { all: ['全部 3 站｜兩天路線', '泰安觀止 → 烏嘎彥竹林 → 荷塘居'], day1: ['第一天｜12/7', '泰安觀止溫泉會館'], day2: ['第二天｜12/8', '泰安觀止 → 烏嘎彥竹林 → 荷塘居'] };
        let currentMode = 'all', currentPlace = 'hotel';
        // 使用 Google Maps 多站路線嵌入，讓所有選定站點一起出現在同一張地圖。
        function mapDirectionsEmbed(ids) { const ps = ids.map(place); return 'https://maps.google.com/maps?saddr=' + encodeURIComponent(ps[0].title + ' ' + ps[0].address) + '&daddr=' + ps.slice(1).map(p => encodeURIComponent(p.title + ' ' + p.address)).join('+to:') + '&output=embed'; }
        function mapDirectionsOpen(ids) { return route(ids); }
        function updatePins(ids) { document.getElementById('map-pins').innerHTML = ids.map((id, order) => { const p = place(id), isDay2 = currentMode === 'day2' || (currentMode === 'all' && ['bamboo', 'persimmon'].includes(id)) || (currentMode === 'all' && id === 'hsr' && order === ids.length - 1); const day = id === 'hsr' && currentMode === 'all' ? (order === 0 ? '12/7 集合' : '12/8 解散') : (isDay2 ? '12/8' : '12/7'); return `<a class="pin-item ${isDay2 ? 'day2' : ''}" href="${nav(id)}" target="_blank" rel="noopener" title="查看 ${p.title} 的地圖"><span class="pin-number">${order + 1}</span><span class="pin-name">${p.title}<span class="pin-day">${day} · 查看地點 ↗</span></span></a>` }).join(''); }
        function setMapMode(mode) {
            if (mode !== 'single' && !MAP_GROUPS[mode]) return; currentMode = mode;
            document.querySelectorAll('[data-map-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mapMode === mode)));
            document.getElementById('single-map-chooser').hidden = mode !== 'single';
            if (mode === 'single') { setMapPlace(currentPlace); return; }
            const ids = MAP_GROUPS[mode];
            document.getElementById('map-place-name').textContent = mapModes[mode][0];
            document.getElementById('map-place-address').textContent = mapModes[mode][1];
            const open = document.getElementById('map-open-link'); open.href = mapDirectionsOpen(ids); open.textContent = '在 Google Maps 查看' + (mode === 'all' ? '全' : '當日') + '路線 ↗';
            mapFrame.title = mapModes[mode][0] + ' Google 地圖'; mapFrame.src = mapDirectionsEmbed(ids);
            updatePins(ids);
        }
        function setMapPlace(id) {
            const p = place(id); if (!p) return; currentPlace = id;
            document.querySelectorAll('[data-map-place]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mapPlace === id)));
            document.getElementById('map-place-name').textContent = p.title;
            document.getElementById('map-place-address').textContent = p.address;
            const open = document.getElementById('map-open-link'); open.href = nav(id); open.textContent = '開啟 Google Maps ↗';
            mapFrame.title = p.title + ' Google 地圖'; mapFrame.src = 'https://maps.google.com/maps?q=' + encodeURIComponent(p.title + ' ' + p.address) + '&z=13&output=embed';
            updatePins([id]);
        }
        document.querySelectorAll('[data-map-mode]').forEach(b => b.addEventListener('click', () => setMapMode(b.dataset.mapMode)));
        document.querySelectorAll('[data-map-place]').forEach(b => b.addEventListener('click', () => setMapPlace(b.dataset.mapPlace)));
        setMapMode('all');
        const tagClass = t => t.includes('待') ? 'tag pending' : 'tag';
        DAYS[0].items = DAYS[0].items.filter(item => item[1] !== '汶水遊客中心集合');
        const HIDE_TIMELINE_NAVIGATION = new Set(['午餐 泰安觀止溫泉會館', '泡湯、下午茶', '晚餐', '自行早餐及自由活動', '烏嘎彥竹林散步', '午餐 荷塘居']);
        const STAY_INFO = `<details class="stay-info"><summary>泰安觀止住宿資訊</summary><div class="stay-content"><p><strong>戶外泡湯區</strong></p><p>早場：07:00–12:00，最後入場 11:00；午場：14:00–22:00，最後入場 21:00。</p><p>泳裝區包含戶外冷水池、溫泉池與蒸氣室，需著泳帽、泳衣。</p><p>裸湯區包含男、女裸湯露天池區、蒸氣室與烤箱。</p><p>房客不限入場次數。</p><p><strong>房型</strong></p><p>每一個房型皆有<span class="highlight-red">室內泡湯</span>。</p><ul><li>觀水日式兩人房（一大床）× 3</li><li>觀水歐式兩人房（兩小床）× 1</li><li>觀山四人房（兩大床）× 1</li></ul></div></details>`;
        document.querySelector('#days').innerHTML = DAYS.map((d, i) => `<div class="day-panel ${i === 0 ? 'active' : ''}" id="day${i}" role="tabpanel" aria-labelledby="tab${i}"><div class="day-overview"><b>DAY ${i + 1}｜${d.date} ${d.weekday}</b>${d.subtitle ? `<p>${d.subtitle}</p>` : ''}</div>${i === 0 ? STAY_INFO : ''}<div class="timeline">${d.items.map(it => `<div class="step"><div class="time">${it[0].replace('–', '<br>–')}</div><div class="dot"></div><div class="step-card"><div class="row"><h3>${it[1]}</h3><span class="${tagClass(it[4])}">${it[4]}</span></div>${it[5] ? `<p class="step-address">地址：${it[5]}</p>` : ''}${it[2] ? `<p>${it[2]}</p>` : ''}${HIDE_TIMELINE_NAVIGATION.has(it[1]) ? '' : `<a class="mini-link" target="_blank" rel="noopener" href="${nav(it[3])}">地圖導航 ↗</a>`}</div></div>`).join('')}</div></div>`).join('');
        function switchDay(i) { document.querySelectorAll('.day-panel').forEach((p, j) => p.classList.toggle('active', i === j)); document.querySelectorAll('[role=tab]').forEach((p, j) => p.setAttribute('aria-selected', i === j ? 'true' : 'false')) }
        function copySummary() { const s = DAYS.map(d => `${d.date} ${d.weekday}\n` + d.items.map(it => `${it[0]} ${it[1]}`).join('\n')).join('\n\n'); const t = '苗栗泰安兩天一夜｜11人家庭旅遊\n' + s + '\n\n導覽及用餐尚待確認。'; if (navigator.clipboard && location.protocol !== 'file:') navigator.clipboard.writeText(t).then(() => { document.querySelector('#copy-status').textContent = '行程已複製。' }).catch(() => fallback(t)); else fallback(t) } function fallback(t) { const ta = document.createElement('textarea'); ta.value = t; document.body.append(ta); ta.select(); try { document.execCommand('copy'); document.querySelector('#copy-status').textContent = '行程已複製。' } catch (e) { document.querySelector('#copy-status').textContent = '複製失敗，請直接選取時間表。' } ta.remove() }
    </script>
</body>
